name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow a manual redeploy from the Actions tab.
  workflow_dispatch:

# Least privilege: only what Pages deployment actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it half-way, which can leave Pages serving a partial site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build site
        run: npm run build:ci

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap-index.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          # Blog permalinks inherited from the Jekyll site must keep resolving.
          for slug in monitoring nat-gateway unity-docker capistrano portainer \
                      vim-editor hping3 github-branching \
                      reading-an-ipv4-address reading-a-traceroute \
                      reading-a-packet-capture decoding-tokens-safely; do
            test -f "dist/blog/${slug}.html" || { echo "::error::missing /blog/${slug}"; exit 1; }
          done
          # Every tool page must exist.
          for tool in subnet-calculator traceroute-analyzer pcap-analyzer \
                      base64 jwt-decoder openssl-toolkit yaml-json cron-expression generators; do
            test -f "dist/tools/${tool}.html" || { echo "::error::missing /tools/${tool}"; exit 1; }
          done
          # The Network Lens collectors must ship, or the tool page links to nothing.
          test -f dist/netlens.sh
          test -f dist/netlens.ps1
          test -f dist/tools/network-lens.html
          # Incident Room: the hub, the two references, and every playbook.
          test -f dist/incident-room.html
          for page in atlas file-investigator high-cpu memory-pressure disk-full \
                      process-stuck port-unreachable dns-failure tls-failure \
                      permission-denied crashloopbackoff imagepullbackoff \
                      oomkilled bad-gateway certificate-expiry \
                      systemd-unit-failed; do
            test -f "dist/incident-room/${page}.html" || { echo "::error::missing /incident-room/${page}"; exit 1; }
          done
          echo "Build verified: $(find dist -name '*.html' | wc -l) HTML pages."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
